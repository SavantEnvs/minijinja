# Additive KAT (known-answer-test) probe crate for the Mayhem integration.
# Lives under mayhem/kat/ and is NEVER part of upstream. It depends on the
# UNMODIFIED minijinja crate at the repo root and renders a few fixed templates,
# printing their exact output so mayhem/test.sh can assert computed values through
# a dynamically-linked binary (the behavioral oracle, SPEC §6.3). The standalone
# [workspace] table keeps this crate out of the root workspace's resolution so the
# upstream manifest is never touched.
[package]
name = "minijinja-mayhem-kat"
version = "0.0.0"
publish = false
edition = "2021"

[[bin]]
name = "kat-probe"
path = "src/main.rs"

[dependencies.minijinja]
path = "../../minijinja"

# Keep this crate out of the upstream root workspace's resolution.
[workspace]
members = ["."]
